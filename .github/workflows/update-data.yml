name: Daily data refresh

# Auto-update pipeline "A": checks machine-readable sources once a day and
# commits any snapshot changes. Vercel then auto-deploys on push.
on:
  schedule:
    - cron: '0 13 * * *' # 13:00 UTC ≈ 6:00 AM PT daily
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest source snapshots
        run: node scripts/fetch-data.mjs

      - name: Commit changes if any
        run: |
          git config user.name "safejew-bot"
          git config user.email "actions@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "chore(data): daily auto-refresh [skip ci]"
            git push
          else
            echo "No changes."
          fi
