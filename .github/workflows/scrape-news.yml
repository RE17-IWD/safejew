name: News scrape

# Pulls recent Greater-LA antisemitism coverage (all incident types) into
# src/data/news.json every ~3 days and commits it (no [skip ci], so Vercel
# redeploys with the fresh feed). Also geocodes incidents for the map.
on:
  schedule:
    - cron: '0 13 */3 * *' # 13:00 UTC, every 3rd day
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scrape recent coverage
        run: node scripts/scrape-news.mjs

      - name: Commit if changed
        run: |
          git config user.name "safejew-bot"
          git config user.email "actions@users.noreply.github.com"
          if [[ -n "$(git status --porcelain src/data/news.json)" ]]; then
            git add src/data/news.json
            git commit -m "chore(news): coverage refresh"
            git push
          else
            echo "No change."
          fi
